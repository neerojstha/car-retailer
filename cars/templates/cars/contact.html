{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | Baniya Motors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            padding-top: 80px;
        }

        .contact-section {
            padding: 120px 0;
        }

        .contact-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-custom {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            padding: 12px;
            border-radius: 12px;
            border: none;
            width: 100%;
            font-weight: 600;
        }

        .contact-info {
            background: #0f172a;
            color: white;
            padding: 40px;
            border-radius: 20px;
            height: 100%;
        }

        .contact-info h3 {
            margin-bottom: 20px;
        }

        .contact-info p {
            margin-bottom: 10px;
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>

<body>

<div class="container contact-section">

    <div class="text-center mb-5">
        <h1>Contact Us</h1>
        <p>We are here to help you find your dream car</p>
    </div>

    <div class="row g-4">

        <!-- Contact Form -->
        <div class="col-lg-7">
            <div class="contact-box">

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label>Phone</label>
                        <input type="text" class="form-control" name="phone">
                    </div>

                    <div class="mb-3">
                        <label>Message</label>
                        <textarea class="form-control" name="message" rows="5" required></textarea>
                    </div>

                    <button type="submit" class="btn-custom">Send Message</button>

                </form>

            </div>
        </div>

        <!-- Contact Info -->
        <div class="col-lg-5">
            <div class="contact-info">

                <h3>Motorhive</h3>

                <p>📍 Dublin, Ireland</p>
                <p>📞 +123 456 7890</p>
                <p>📧 info@baniyamotors.com</p>
                <p>🕒 Mon - Sat: 9AM - 6PM</p>

                <hr style="border-color: rgba(255,255,255,0.2);">

                <p>We respond within 24 hours to all inquiries.</p>

            </div>
        </div>

    </div>

</div>

</body>
</html>
