{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ car.title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #020617;
            color: white;
            font-family: Arial, sans-serif;
        }

        .detail-section {
            padding: 80px 0;
        }

        /* NEW CAROUSEL IMAGE STYLE */
        .car-slider-image {
            width: 100%;
            border-radius: 20px;
            height: 500px;
            object-fit: cover;
        }

        .carousel {
            overflow: hidden;
            border-radius: 20px;
        }

        .gallery-wrap {
            width: 100%;
        }

        .main-image-box {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #0f172a;
        }

        .main-car-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            display: block;
            border-radius: 20px;
        }

        .thumbnail-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .thumb-img {
            width: 100%;
            height: 95px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
            opacity: 0.75;
        }

        .thumb-img:hover {
            opacity: 1;
            transform: scale(1.03);
        }

        .active-thumb {
            border-color: #38bdf8;
            opacity: 1;
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.75);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .prev-btn {
            left: 16px;
        }

        .next-btn {
            right: 16px;
        }

        @media (max-width: 991px) {
            .main-car-image {
                height: 380px;
            }

            .thumbnail-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 575px) {
            .main-car-image {
                height: 280px;
            }

            .thumbnail-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .thumbnail-img {
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
            width: 100%;
        }

        .car-info {
            padding-left: 40px;
        }

        .price {
            color: #38bdf8;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .info-box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .btn-premium {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .btn-premium:hover {
            color: white;
            transform: translateY(-2px);
        }

        @media(max-width: 991px) {
            .car-info {
                padding-left: 0;
                margin-top: 40px;
            }
        }
    </style>
</head>

<body>

<section class="detail-section">
    <div class="container">

        <div class="row align-items-center">

            <!-- LEFT SIDE IMAGE SLIDER -->
            <div class="col-lg-6">
                <div class="gallery-wrap">

                    <div class="main-image-box position-relative">
                        <img id="mainCarImage"
                            src="{{ car.image.url }}"
                            alt="{{ car.title }}"
                            class="main-car-image">

                        <button type="button" class="gallery-nav prev-btn" onclick="changeImage(-1)">
                                &#10094;
                        </button>

                         <button type="button" class="gallery-nav next-btn" onclick="changeImage(1)">
                                &#10095;
                        </button>
                    </div>

                    <div class="thumbnail-grid mt-3">
                        <img src="{{ car.image.url }}"
                            class="thumb-img active-thumb"
                            alt="{{ car.title }}"
                            onclick="setImage(0, this)">

                        {% for img in car.images.all %}
                        <img src="{{ img.image.url }}"
                            class="thumb-img"
                            alt="{{ car.title }}"
                            onclick="setImage({{ forloop.counter }}, this)">
                        {% endfor %}
                    </div>

                </div>
        </div>

            <!-- RIGHT SIDE INFO -->
            <div class="col-lg-6">

                <div class="car-info">

                    <h1 class="mb-4">{{ car.title }}</h1>

                    <div class="price mb-4">
                        €{{ car.price }}
                    </div>

                    <div class="info-box">
                        <strong>Brand:</strong> {{ car.brand }}
                    </div>

                    <div class="info-box">
                        <strong>Year:</strong> {{ car.year }}
                    </div>

                    <div class="info-box">
                        <strong>Fuel:</strong> {{ car.fuel_type }}
                    </div>

                    <div class="info-box">
                        <strong>Transmission:</strong> {{ car.transmission }}
                    </div>

                    <div class="info-box">
                        <strong>Description:</strong><br><br>
                        {{ car.description }}
                    </div>

                    <a href="/" class="btn-premium">
                        ← Back to Cars
                    </a>

                </div>

            </div>

        </div>

    </div>
</section>

<!-- IMPORTANT FOR CAROUSEL -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const galleryImages = [
        "{{ car.image.url }}",
        {% for img in car.images.all %}
            "{{ img.image.url }}"{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];

    let currentIndex = 0;

    function updateMainImage() {
        document.getElementById("mainCarImage").src = galleryImages[currentIndex];

        document.querySelectorAll(".thumb-img").forEach((thumb, index) => {
            thumb.classList.toggle("active-thumb", index === currentIndex);
        });
    }

    function setImage(index, el) {
        currentIndex = index;
        updateMainImage();
    }

    function changeImage(direction) {
        currentIndex += direction;

        if (currentIndex < 0) {
            currentIndex = galleryImages.length - 1;
        }

        if (currentIndex >= galleryImages.length) {
            currentIndex = 0;
        }

        updateMainImage();
    }
</script>

</body>
</html>
