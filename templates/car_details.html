{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ car.title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #020617;
            color: white;
            font-family: Arial, sans-serif;
        }

        .detail-section {
            padding: 80px 0;
        }

        .car-image img {
            width: 100%;
            border-radius: 20px;
            height: 500px;
            object-fit: cover;
        }

        .car-info {
            padding-left: 40px;
        }

        .price {
            color: #38bdf8;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .info-box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .btn-premium {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<section class="detail-section">
    <div class="container">

        <div class="row align-items-center">

            <div class="col-lg-6">
                <div class="car-image">
                    <img src="{{ car.image.url }}" alt="{{ car.title }}">
                </div>
            </div>

            <div class="col-lg-6">
                <div class="car-info">

                    <h1 class="mb-4">{{ car.title }}</h1>

                    <div class="price mb-4">
                        €{{ car.price }}
                    </div>

                    <div class="info-box">
                        <strong>Brand:</strong> {{ car.brand }}
                    </div>

                    <div class="info-box">
                        <strong>Year:</strong> {{ car.year }}
                    </div>

                    <div class="info-box">
                        <strong>Fuel:</strong> {{ car.fuel_type }}
                    </div>

                    <div class="info-box">
                        <strong>Transmission:</strong> {{ car.transmission }}
                    </div>

                    <div class="info-box">
                        <strong>Description:</strong><br><br>
                        {{ car.description }}
                    </div>

                    <a href="/" class="btn-premium">
                        ← Back to Cars
                    </a>

                </div>
            </div>

        </div>

    </div>
</section>

</body>
</html>
